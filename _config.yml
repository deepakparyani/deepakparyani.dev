# Jekyll configuration.
# GitHub Pages builds this repo automatically on every push to main - there is
# no CI workflow and no local build step required to publish.

title: Deepak Paryani
description: >-
  Deepak Paryani - Tech Lead at Finarkein Analytics and founder of CereLume
  Technologies. Notes on agentic AI, fintech infrastructure and building software.
url: https://deepakparyani.dev
baseurl: ""
timezone: Asia/Kolkata

# Posts live in _posts/YYYY-MM-DD-slug.md and are published at /blog/slug/
permalink: /blog/:title/

# Only plugins GitHub Pages ships with. Anything else would break the build.
plugins:
  - jekyll-feed

feed:
  path: feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Deepak Paryani

# Comments. Powered by Giscus (GitHub Discussions) - free, no database, no
# tracking. Requires the Giscus GitHub App installed on this repo and
# Discussions enabled. Regenerate the ids at https://giscus.app if you change
# the repository, mapping or category. Until both ids are set, no comment
# script is rendered at all.
giscus:
  repo: deepakparyani/deepakparyani.dev
  repo_id: "R_kgDOQkqS0g"
  category: General
  category_id: "DIC_kwDOQkqS0s4DKu4_"
  # pathname ties a thread to the URL path (/blog/<slug>/), so renaming a post
  # file starts a new thread. url also breaks on domain changes; title (and
  # og:title) break when you edit a headline. pathname is the safest here.
  mapping: pathname
  # strict only applies to title / og:title mappings.
  strict: 0
  reactions: 1
  emit_metadata: 0
  # bottom reads more naturally on long posts; top keeps the box in view.
  input_position: bottom
  # dark | dark_dimmed | transparent_dark (blends into any dark background)
  theme: dark
  loading: lazy

# Keep build tooling and repo docs out of the published site.
exclude:
  - node_modules
  - src
  - package.json
  - package-lock.json
  - tailwind.config.js
  - README.md
  - .pages.yml
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - vendor
