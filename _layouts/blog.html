<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{{ page.description | default: site.description | normalize_whitespace }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta name="author" content="{{ site.title }}">

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
    <meta property="og:site_name" content="{{ site.title }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:title" content="{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}">
    <meta property="og:description" content="{{ page.description | default: site.description | normalize_whitespace }}">
    <meta property="og:image" content="{{ '/assets/images/profile.jpg' | absolute_url }}">

    <!-- Feed -->
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | absolute_url }}">

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230A0A0A'/%3E%3Ctext x='32' y='44' font-family='Arial,Helvetica,sans-serif' font-size='28' font-weight='bold' text-anchor='middle' fill='%2300F5FF'%3EDP%3C/text%3E%3C/svg%3E">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind (built locally - run `npm run build:css` after changing classes) -->
    <link rel="stylesheet" href="/css/tailwind.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- Animated Background -->
    <canvas class="particle-bg" id="particle-canvas" aria-hidden="true"></canvas>

    <!-- Navigation -->
    <nav class="fixed top-0 w-full z-50 glass-card border-b border-white/10">
        <div class="container mx-auto px-6 py-4">
            <div class="flex justify-between items-center">
                <a href="/" class="text-3xl font-display font-bold gradient-text glow-text">DP</a>
                <div class="hidden md:flex space-x-10">
                    <a href="/#home" class="nav-link text-gray-300 hover:text-white transition">Home</a>
                    <a href="/#experience" class="nav-link text-gray-300 hover:text-white transition">Journey</a>
                    <a href="/#projects" class="nav-link text-gray-300 hover:text-white transition">Projects</a>
                    <a href="/blog/" class="nav-link text-cyan-400 transition">Writing</a>
                    <a href="/#contact" class="nav-link text-gray-300 hover:text-white transition">Connect</a>
                </div>
                <button id="nav-toggle" type="button"
                        class="md:hidden p-3 rounded-lg text-gray-300 hover:text-white transition"
                        aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="mobile-menu">
                    <i class="fas fa-bars text-xl"></i>
                </button>
            </div>
            <!-- Mobile menu -->
            <div id="mobile-menu" class="md:hidden hidden mt-4 pt-4 border-t border-white/10" aria-label="Mobile navigation">
                <div class="flex flex-col space-y-4 pb-2">
                    <a href="/" class="mobile-nav-link text-gray-300 hover:text-white transition">Home</a>
                    <a href="/#experience" class="mobile-nav-link text-gray-300 hover:text-white transition">Journey</a>
                    <a href="/#projects" class="mobile-nav-link text-gray-300 hover:text-white transition">Projects</a>
                    <a href="/blog/" class="mobile-nav-link text-cyan-400 transition">Writing</a>
                    <a href="/#contact" class="mobile-nav-link text-gray-300 hover:text-white transition">Connect</a>
                    <a href="/resume.html" class="mobile-nav-link text-gray-300 hover:text-white transition">Résumé</a>
                </div>
            </div>
        </div>
    </nav>

    <main>
        {{ content }}
    </main>

    <!-- Footer -->
    <footer class="py-12 px-6 bg-black border-t border-white/10">
        <div class="container mx-auto max-w-4xl text-center">
            <div class="flex justify-center flex-wrap gap-6 mb-4">
                <a href="/" class="text-gray-400 hover:text-cyan-400 transition">Home</a>
                <a href="/blog/" class="text-gray-400 hover:text-cyan-400 transition">Writing</a>
                <a href="/feed.xml" class="text-gray-400 hover:text-cyan-400 transition">RSS</a>
                <a href="/resume.html" class="text-gray-400 hover:text-cyan-400 transition">Résumé</a>
                <a href="https://github.com/deepakparyani" target="_blank" rel="noopener" class="text-gray-400 hover:text-cyan-400 transition">GitHub</a>
                <a href="https://linkedin.com/in/deepakparyani" target="_blank" rel="noopener" class="text-gray-400 hover:text-cyan-400 transition">LinkedIn</a>
            </div>
            <p class="text-gray-500 text-sm">
                &copy; 2026 {{ site.title }}. Crafted with <i class="fas fa-heart text-red-500"></i> and copious amounts of coffee.
            </p>
        </div>
    </footer>

    <!-- Back to Top -->
    <button id="back-to-top" type="button" aria-label="Back to top" class="fixed bottom-8 right-8 w-16 h-16 bg-gradient-to-r from-cyan-500 to-purple-600 rounded-full text-white text-xl shadow-2xl hover:scale-110 transition transform hover:rotate-90 hidden z-50">
        <i class="fas fa-arrow-up"></i>
    </button>

    <script src="/js/main.js"></script>
</body>
</html>
